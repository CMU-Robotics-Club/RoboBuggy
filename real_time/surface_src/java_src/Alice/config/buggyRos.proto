syntax = "proto3";

package robobuggy;

option java_package = "com.roboclub.robobuggy.messaging_autogen";
option java_outer_classname = "RobobuggyMessagingProto";

message RobobuggyMessage {

    message RobobuggyMessageMetadata {
        RobobuggySensors sensor = 1;
        string sensorSubtype = 2;
    }

    message RobobuggyMessageParameterSet {
        string key = 1;
        int32 valueAsInt = 2;
        bool valueAsBool = 3;
        double valueAsDouble = 4;
        string valueAsString = 5;
    }

    RobobuggyMessageMetadata metadata = 1;
    repeated RobobuggyMessageParameterSet params = 2;

    enum RobobuggySensors {
        GPS = 0;
        IMU = 1;
        ENCODER = 2;
        CAMERA = 3;
        LOGGING = 4;
        PATH_PLANNER = 5;
        LOCALIZER = 6;
        LOGIC_NOTIFICATION = 7;
    }

}
