syntax = "proto3";

package robobuggy;

option java_package = "com.roboclub.robobuggy.messaging_autogen";
option java_outer_classname = "RobobuggyMessagingProto";

message RobobuggyMessage {
    string messageOrigin = 1;
    string sensor = 2;
    string sensorSubtype = 3;

    enum RobobuggyMessageChannels {
        GPS = 0;
        IMU = 1;
    };
}
